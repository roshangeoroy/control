<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="app-container">

    <!-- Header -->
    <div class="header">
      <p class="room-label" id="roomLabel"></p>
      <h1 id="deviceName"></h1>
    </div>

    <!-- Lamp stage carousel -->
    <div class="lamp-section">
      <div class="device-carousel" id="deviceCarousel">
        <div class="device-track" id="deviceTrack">
          <!-- Lamp panels injected by app.js -->
        </div>
      </div>
    </div>

    <!-- Carousel position dots -->
    <div class="carousel-dots" id="carouselDots"></div>

    <!-- Device controls — injected per lamp by app.js -->
    <div class="controls-panel" id="controlsPanel"></div>

  </div>

  <script src="background.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
